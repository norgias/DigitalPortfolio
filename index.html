<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="0">
  <title>Nick Orgias - Digital Portfolio</title>
  <link rel="shortcut icon" href="/favicon.ico">
  <!-- Swiper CSS -->
  <link rel="stylesheet" href="https://unpkg.com/swiper/swiper-bundle.min.css" />
  <!-- Custom CSS -->
  <link rel="stylesheet" href="new-style.css">
  <!-- Jquery library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
  <!-- Modernizer -->
  <script src="http://cdnjs.cloudflare.com/ajax/libs/modernizr/2.5.3/modernizr.min.js"></script>
</head>

<body>
  <!-- Navigation Menu -->
  <header>
    <nav class="nav-menu">
      <a href="#myAnchor0">Home</a>
      <a href="#myAnchor">Portfolio</a>
      <a href="#myAnchor3">Contact</a>
    </nav>
  </header>

  <!-- Image Slider Carousel -->
  <div class="slider-container">
    <h1 class="slider-title">Portfolio</h1>
    <div class="swiper-container">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <a href="http://testingpage.altervista.org/">
            <img src="images/roswell.png" alt="Roswell Gymnastics">
          </a>
          <h2>Roswell Gymnastics</h2>
        </div>
        <div class="swiper-slide">
          <a href="https://norgias.github.io/BrickBreaker/canvas.html">
            <img src="images/game.png" alt="Brick Breaker Game">
          </a>
          <h2>Brick Breaker Game</h2>
        </div>
        <div class="swiper-slide">
          <a href="http://norgias.github.io/NaniExtensions/index.html">
            <img src="images/nani.png" alt="Nani Extensions eCommerce">
          </a>
          <h2>Nani Extensions eCommerce</h2>
        </div>
        <div class="swiper-slide">
          <a href="http://norgias.github.io/Larryn/LarrynIndex.html">
            <img src="images/larryn.png" alt="Non-Profit Website">
          </a>
          <h2>Non-Profit Website</h2>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    &copy 2016 - Nicolas J Orgias - Dynamic Web Development
  </footer>

  <!-- Swiper Scripts -->
  <script src="https://unpkg.com/swiper/swiper-bundle.min.js"></script>
  <script>
    const swiper = new Swiper('.swiper-container', {
      loop: true,
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },
      pagination: {
        el: '.swiper-pagination',
        clickable: true,
      },
      spaceBetween: 50,
    });
  </script>
</body>
</html>
